[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuktech-ultra"
version = "0.1.0"
description = "Standalone offline BLE client and Web dashboard for CUKTECH 10 GaN Charger Ultra (njcuk.fitting.ad1204)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["cuktech", "ble", "mible", "miot", "charger", "gan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "bleak>=0.22.0",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
cuktech-ultra = "cuktech_ultra.cli:app"

[tool.setuptools.packages.find]
include = ["cuktech_ultra*"]

[tool.setuptools.package-data]
cuktech_ultra = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
